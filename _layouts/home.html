---
layout: default
---
<section class="hero">
  <div class="container hero-inner">
    {% if site.photo != "" %}
      <img class="hero-photo" src="{{ site.photo | relative_url }}" alt="Photo of {{ site.title }}">
    {% endif %}
    <div>
      <p class="eyebrow">{{ site.position }} · {{ site.affiliation }}</p>
      <h1>{{ site.title }}</h1>
      <p class="hero-tagline">{{ site.tagline }}</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="{{ '/vision/' | relative_url }}">Read my vision</a>
        <a class="btn btn-ghost" href="{{ '/research/' | relative_url }}">Research</a>
        {% if site.cv_pdf != "" %}<a class="btn btn-ghost" href="{{ site.cv_pdf | relative_url }}">CV (PDF)</a>{% endif %}
      </div>
    </div>
  </div>
</section>

<div class="container">
  {{ content }}
</div>
