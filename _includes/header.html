<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo.svg' | relative_url }}" alt="" width="32" height="32">
      <span>{{ site.short_name }}</span>
    </a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-toggle-label"><span></span></label>

    <nav class="site-nav">
      {% for link in site.nav %}
        {% assign link_url = link.url | relative_url %}
        {% assign page_url = page.url | relative_url %}
        <a href="{{ link_url }}" {% if page_url == link_url %}aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
